[project]
name = "papermate"
version = "0.1.0"
description = "PaperMate 知微 —— 社科论文共读工作流的本地 CLI 助手（配合 OpenCode / Codex Skill 使用）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "click>=8.0",
    "PyMuPDF>=1.24",
]

[project.scripts]
papermate = "papermate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["papermate"]
